[package]
name = "canokey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
homepage.workspace = true
description = "Transport-free CanoKey host protocol library"
publish = false

[dependencies]
canokey-protocol.workspace = true
canokey-compat.workspace = true
canokey-admin.workspace = true
canokey-piv.workspace = true

canokey-x509 = { workspace = true, optional = true }

[features]
x509 = ["dep:canokey-x509"]
serde = ["x509", "canokey-x509/serde"]

[dev-dependencies]
serde_json = "1"

[[example]]
name = "inspect_certificate"
required-features = ["serde"]
