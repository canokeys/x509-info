name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ['1.85.1']
        include:
          - os: ubuntu-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --locked
      - run: cargo test --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo run --example binding_dto --locked
      - run: cargo run --features cli --locked -- tests/fixtures/details.pem --format json
      - if: matrix.os == 'ubuntu-latest' && matrix.toolchain == '1.85.1'
        run: cargo fmt --all --check
      - if: matrix.os == 'ubuntu-latest' && matrix.toolchain == '1.85.1'
        name: Check documentation, wasm, dependencies and packaging
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps --locked
          cargo build --features schema --target wasm32-unknown-unknown --locked
          python3 scripts/check-dependencies.py
          cargo package --all-features --locked
      - if: matrix.os == 'ubuntu-latest' && matrix.toolchain == '1.85.1'
        name: Check report schemas with independent validators
        run: |
          python3 -m venv "$RUNNER_TEMP/x509-schema-env"
          "$RUNNER_TEMP/x509-schema-env/bin/python" -m pip install -r scripts/requirements-schema.txt
          "$RUNNER_TEMP/x509-schema-env/bin/python" scripts/check-x509-schema.py target/debug/x509-info
