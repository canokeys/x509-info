[package]
name = "x509-info"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["canokeys.org"]
license = "Apache-2.0"
homepage = "https://github.com/canokeys/x509-info"
repository = "https://github.com/canokeys/x509-info"
documentation = "https://docs.rs/x509-info"
description = "Owned X.509 certificate information for applications"
readme = "README.md"
keywords = ["x509", "certificate", "pem", "inspection"]
categories = ["parser-implementations", "cryptography"]
publish = ["crates-io"]
include = ["lib/**", "bin/**", "tests/**", "examples/**", "docs/**", "scripts/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
path = "lib/mod.rs"

[[bin]]
name = "x509-info"
path = "bin/main.rs"
required-features = ["cli"]

[features]
serde = ["dep:serde"]
schema = ["serde", "dep:schemars"]
cli = ["schema", "dep:serde_yaml_ng", "dep:rmp-serde", "dep:clap", "dep:serde_json", "dep:ciborium", "dep:toml", "dep:base64ct", "dep:uuid"]

[dependencies]
serde_yaml_ng = { version = "0.10", optional = true }
schemars = { version = "1", optional = true }
rmp-serde = { version = "1.3", optional = true }
base64ct = { version = "1.7.3", features = ["alloc"], optional = true }
uuid = { version = "1", default-features = false, optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
toml = { version = "0.8", optional = true }
x509-cert = { version = "0.3", default-features = false }
oid-registry = { version = "0.8", features = ["crypto", "x509", "x500"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
pkcs1 = { version = "0.7", default-features = false }
x509-parser = { version = "0.18.1", default-features = false }
pem-rfc7468 = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

[package.metadata.docs.rs]
all-features = true
