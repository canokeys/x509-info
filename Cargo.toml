[package]
name = "x509-info"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
description = "Owned X.509 certificate information for applications"
readme = "README.md"
keywords = ["x509", "certificate", "pem", "inspection"]
categories = ["parser-implementations", "cryptography"]
publish = false

[features]
serde = ["dep:serde"]

[dependencies]
x509-cert = { version = "0.3", default-features = false }
oid-registry = { version = "0.8", features = ["crypto", "x509", "x500"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
pkcs1 = { version = "0.7", default-features = false }
x509-parser = { version = "0.18.1", default-features = false }
pem-rfc7468 = { version = "1", default-features = false, features = ["alloc"] }
thiserror.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

[[example]]
name = "export_json"
required-features = ["serde"]

[[example]]
name = "export_formats"
required-features = ["serde"]
